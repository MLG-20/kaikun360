<app-account-header [sidebarOpen]="sidebarOpen()" (sidebarToggle)="toggleSidebar()" />

<div class="account-shell k-wrap" [class.is-open]="sidebarOpen()">
  <!-- Fond assombri (petit écran) : un clic referme le tiroir -->
  @if (sidebarOpen()) {
    <div class="account-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <!-- Navigation latérale des rubriques (tiroir en petit écran) -->
  <aside
    class="account-side"
    [class.is-open]="sidebarOpen()"
    aria-label="Navigation de l’espace client"
  >
    <p class="account-side-title">Mon espace</p>

    <nav class="account-nav">
      @for (item of nav; track item.path) {
        @if (item.ready) {
          <a
            class="account-nav-link"
            [routerLink]="item.path ? ['/mon-espace', item.path] : ['/mon-espace']"
            [routerLinkActive]="'is-active'"
            [routerLinkActiveOptions]="{ exact: item.path === '' }"
            (click)="closeSidebar()"
          >
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
          </a>
        } @else {
          <span class="account-nav-link is-soon" aria-disabled="true">
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
            <span class="account-soon-tag">Bientôt</span>
          </span>
        }
      }
    </nav>
  </aside>

  <!-- Contenu de la section active -->
  <main class="account-main">
    <router-outlet />
  </main>
</div>
