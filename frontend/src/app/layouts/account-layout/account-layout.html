<app-header />

<div class="account-shell k-wrap">
  <!-- Navigation latérale de l'espace personnel -->
  <aside class="account-side" aria-label="Navigation de l’espace client">
    <div class="account-side-head">
      <span class="account-avatar" aria-hidden="true">{{ (user()?.name || '?')[0] }}</span>
      <div class="account-side-id">
        <strong>{{ user()?.name || 'Mon espace' }}</strong>
        @if (user()?.email || user()?.phone) {
          <span class="account-side-contact">{{ user()?.email || user()?.phone }}</span>
        }
      </div>
    </div>

    <nav class="account-nav">
      @for (item of nav; track item.path) {
        @if (item.ready) {
          <a
            class="account-nav-link"
            [routerLink]="item.path ? ['/mon-espace', item.path] : ['/mon-espace']"
            [routerLinkActive]="'is-active'"
            [routerLinkActiveOptions]="{ exact: item.path === '' }"
          >
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
          </a>
        } @else {
          <span class="account-nav-link is-soon" aria-disabled="true">
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
            <span class="account-soon-tag">Bientôt</span>
          </span>
        }
      }
    </nav>

    <button type="button" class="account-logout" (click)="logout()">Se déconnecter</button>
  </aside>

  <!-- Contenu de la section active -->
  <main class="account-main">
    <router-outlet />
  </main>
</div>

<app-footer />
