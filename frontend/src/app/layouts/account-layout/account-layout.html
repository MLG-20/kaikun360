<app-account-header />

<div class="account-shell k-wrap">
  <!-- Navigation latérale des rubriques de l'espace personnel -->
  <aside class="account-side" aria-label="Navigation de l’espace client">
    <p class="account-side-title">Mon espace</p>

    <nav class="account-nav">
      @for (item of nav; track item.path) {
        @if (item.ready) {
          <a
            class="account-nav-link"
            [routerLink]="item.path ? ['/mon-espace', item.path] : ['/mon-espace']"
            [routerLinkActive]="'is-active'"
            [routerLinkActiveOptions]="{ exact: item.path === '' }"
          >
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
          </a>
        } @else {
          <span class="account-nav-link is-soon" aria-disabled="true">
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
            <span class="account-soon-tag">Bientôt</span>
          </span>
        }
      }
    </nav>
  </aside>

  <!-- Contenu de la section active -->
  <main class="account-main">
    <router-outlet />
  </main>
</div>
