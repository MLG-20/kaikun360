<!-- App-shell de l'espace client : menu latéral SOMBRE pleine hauteur collé à
     gauche + colonne contenu (en-tête + section). -->
<div class="account-app">
  <!-- Fond assombri (petit écran) : un clic referme le tiroir -->
  @if (sidebarOpen()) {
    <div class="account-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <!-- ===================== Menu latéral (rail sombre) ====================== -->
  <aside
    class="account-side"
    [class.is-open]="sidebarOpen()"
    aria-label="Navigation de l’espace client"
  >
    <!-- Marque, en haut du rail : retour à l'accueil du site -->
    <a class="account-brand" routerLink="/" aria-label="Accueil Kaikun 360">
      <span class="account-logo" aria-hidden="true">K</span>
      <span class="account-brand-text">
        <b>Kaikun&nbsp;360</b>
        <small>Espace client</small>
      </span>
    </a>

    <!-- Navigation des rubriques -->
    <nav class="account-nav" aria-label="Rubriques">
      @for (item of nav; track item.path) {
        @if (item.ready) {
          <a
            class="account-nav-link"
            [routerLink]="item.path ? ['/mon-espace', item.path] : ['/mon-espace']"
            [routerLinkActive]="'is-active'"
            [routerLinkActiveOptions]="{ exact: item.path === '' }"
            (click)="closeSidebar()"
          >
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
          </a>
        } @else {
          <span class="account-nav-link is-soon" aria-disabled="true">
            <span class="account-nav-ic"><app-account-icon [name]="item.icon" /></span>
            <span class="account-nav-label">{{ item.label }}</span>
            <span class="account-soon-tag">Bientôt</span>
          </span>
        }
      }
    </nav>

    <!-- Pied du rail : aide (mode d'emploi) + retour au site + déconnexion -->
    <div class="account-side-foot">
      <a
        class="account-nav-link"
        routerLink="/mon-espace/aide"
        [routerLinkActive]="'is-active'"
        (click)="closeSidebar()"
      >
        <span class="account-nav-ic"><app-account-icon name="help" /></span>
        <span class="account-nav-label">Aide</span>
      </a>

      <a class="account-nav-link account-side-back" routerLink="/">
        <span class="account-nav-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </span>
        <span class="account-nav-label">Retour au site</span>
      </a>

      <button type="button" class="account-nav-link account-side-logout" (click)="logout()">
        <span class="account-nav-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5M21 12H9" />
          </svg>
        </span>
        <span class="account-nav-label">Se déconnecter</span>
      </button>
    </div>
  </aside>

  <!-- ==================== Colonne contenu (en-tête + section) ============== -->
  <div class="account-body">
    <app-account-header
      [sidebarOpen]="sidebarOpen()"
      (sidebarToggle)="toggleSidebar()"
    />

    <main class="account-main">
      <router-outlet />
    </main>
  </div>
</div>
