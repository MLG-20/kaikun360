@if (visible()) {
  <!-- `role="dialog"` : contrairement au bandeau PWA, une réponse est
       attendue avant que l'outil concerné ne s'active — plus proche d'une
       question posée que d'un simple statut. -->
  <aside class="cookie-banner" role="dialog" aria-label="Consentement aux cookies de mesure d'audience">
    <div class="cookie-banner__texte">
      <p class="cookie-banner__detail">
        Kaikun 360 souhaite mesurer la fréquentation du site (pages visitées,
        origine des visites) pour l'améliorer. Cette mesure n'est activée
        qu'avec votre accord — voir notre
        <a routerLink="/pages/politique-cookies">politique de cookies</a>.
      </p>
    </div>
    <div class="cookie-banner__actions">
      <button type="button" class="cookie-banner__refuser" (click)="refuser()">
        Refuser
      </button>
      <button type="button" class="k-btn k-btn--primary" (click)="accepter()">
        Accepter
      </button>
    </div>
  </aside>
}
