<div class="orbit-wrap">
  <!-- Anneaux tournants (décoratifs) -->
  <span class="orbit-ring r1" aria-hidden="true"></span>
  <span class="orbit-ring r2" aria-hidden="true"></span>

  <!-- Carte centrale : univers mis en avant -->
  <div class="orbit-center">
    <span class="oc-eyebrow">Univers</span>
    <p class="oc-title">{{ active().title }}</p>
    <p class="oc-price">{{ active().price }}</p>
    <a class="oc-cta" href="#">{{ active().cta }}</a>
  </div>

  <!-- Nœuds en orbite -->
  @for (node of nodes; track node.title; let i = $index) {
    <button
      type="button"
      class="orbit-node"
      [class.active]="focused() === i"
      [style.left.%]="node.left"
      [style.top.%]="node.top"
      (mouseenter)="focus(i)"
      (focus)="focus(i)"
      (click)="focus(i)"
      [attr.aria-label]="node.title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        @for (d of node.icon; track $index) {
          <path [attr.d]="d"></path>
        }
      </svg>
    </button>
  }
</div>

<p class="orbit-hint">Survolez un univers pour l'explorer.</p>
