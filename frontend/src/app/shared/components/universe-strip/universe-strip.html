<!-- Décorative : les noms sont déjà accessibles, avec leurs liens, dans la
     grille « Nos univers » plus bas. -->
@if (messageCourant(); as texte) {
  <div class="ustrip" aria-hidden="true">
    <!-- La boucle `@for` ne porte QUE sur le message courant : c'est cette
         recréation du nœud DOM, à chaque changement de `texte`, qui rejoue
         l'animation d'entrée (`ustrip-enter`) — même patron que le carrousel
         vidéo de l'accueil (`appReveal="group"`). -->
    @for (t of [texte]; track t) {
      <span class="ustrip-item">{{ t }}</span>
    }
  </div>
}
