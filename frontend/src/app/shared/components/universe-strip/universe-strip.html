<!-- Décorative : les noms sont déjà accessibles, avec leurs liens, dans la
     grille « Nos univers » plus bas — doubler la liste ici pour le défilement
     en continu la rendrait confuse à un lecteur d'écran. -->
@if (names().length) {
  <div class="ustrip" aria-hidden="true">
    <div class="ustrip-track">
      @for (n of names(); track $index) {
        <span class="ustrip-item">{{ n }}</span>
      }
      @for (n of names(); track $index) {
        <span class="ustrip-item">{{ n }}</span>
      }
    </div>
  </div>
}
