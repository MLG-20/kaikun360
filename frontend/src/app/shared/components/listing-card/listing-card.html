<article class="card" [class.card--link]="!!link()">
  <!-- Lien étiré : couvre toute la carte quand une fiche existe (accessibilité
       préservée — le libellé provient du titre). -->
  @if (link(); as target) {
    <a class="card-stretch" [routerLink]="target" [attr.aria-label]="title()"></a>
  }

  <div class="thumb">
    @if (image()) {
      <img [src]="image()" [alt]="title()" loading="lazy" />
    } @else {
      <span class="thumb-fallback" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"></path>
          <path d="M5 9.5V21h14V9.5"></path>
        </svg>
      </span>
    }

    @if (badge(); as badgeLabel) {
      <span class="badge-slot">
        <app-verification-badge [label]="badgeLabel" />
      </span>
    }

    <!-- Cœur de favori (au-dessus du lien étiré). Affiché seulement si la carte
         est favorisable. -->
    @if (favoritable()) {
      <button
        type="button"
        class="fav-heart"
        [class.is-on]="favorited()"
        [disabled]="favoriteBusy()"
        [attr.aria-pressed]="favorited()"
        [attr.aria-label]="favorited() ? 'Retirer des favoris' : 'Ajouter aux favoris'"
        (click)="onFavoriteClick($event)"
      >
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20s-7-4.35-9.5-8.5C1 8 3 4.5 6.5 4.5c2 0 3.5 1.5 5.5 3.5 2-2 3.5-3.5 5.5-3.5C21 4.5 23 8 21.5 11.5 19 15.65 12 20 12 20z" />
        </svg>
      </button>
    }
  </div>

  <div class="body">
    <h3 class="title">{{ title() }}</h3>
    @if (location()) {
      <p class="location">{{ location() }}</p>
    }

    @if (price()) {
      <p class="price">
        <b>{{ price() }}</b>
        @if (priceUnit()) {
          <span class="unit">{{ priceUnit() }}</span>
        }
      </p>
    }

    @if (link(); as target) {
      <a class="cta" [routerLink]="target">
        {{ cta() }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6"></path>
        </svg>
      </a>
    }
  </div>
</article>
