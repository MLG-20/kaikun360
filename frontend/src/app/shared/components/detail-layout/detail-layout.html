<!-- Bandeau de titre : fil d'Ariane + titre + informations clés, posés sur la
     photo principale de l'annonce (F13.6). -->
<header class="uni-detail-hero" [class.uni-detail-hero--illustre]="photoPrincipale()">
  @if (photoPrincipale(); as photo) {
    <!-- ⚠️ Une vraie balise <img>, et non un `background-image` : le navigateur
         découvre un fond CSS très tard (il lui faut la feuille de style, puis le
         calcul de style), or c'est ici le plus grand élément peint de la page.
         En balise, il est trouvé dès la lecture du HTML et peut être priorisé.
         `aria-hidden` : l'image ne porte aucune information que le titre juste
         à côté ne dise déjà, et la galerie plus bas la présente correctement. -->
    <img
      class="uni-detail-hero-photo"
      [src]="photo"
      alt=""
      aria-hidden="true"
      fetchpriority="high" />
    <span class="uni-detail-hero-voile" aria-hidden="true"></span>
  }

  <div class="k-wrap uni-detail-hero-inner">
    <nav class="uni-detail-crumbs">
      <ng-content select="[crumbs]" />
    </nav>
    <h1 class="uni-detail-title">{{ title() }}</h1>
    <div class="uni-detail-meta">
      <ng-content select="[meta]" />
    </div>
  </div>
</header>

<!-- Galerie photo : affichée seulement s'il y a au moins une image (F2.6). -->
@if (images().length) {
  <div class="k-wrap uni-detail-gallery">
    <app-gallery [images]="images()" [alt]="galleryAlt() || title()" />
  </div>
}

<!-- Corps en deux colonnes. -->
<div class="k-wrap uni-detail-body">
  <!-- Colonne principale : sections projetées (emplacement par défaut). -->
  <div class="uni-detail-main">
    <ng-content />
  </div>

  <!-- Colonne latérale : encart d'action projeté. -->
  <aside class="uni-detail-aside">
    <ng-content select="[aside]" />
  </aside>
</div>
