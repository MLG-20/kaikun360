<!-- Racine : point de routage unique. Les layouts fournissent le décor. -->
<router-outlet />

<!-- Voile de transition entre deux pages (voir `scroll-behavior.ts` /
     `route-transition.service.ts`) : masque la remontée instantanée en haut
     de la page de départ pendant que la page d'arrivée charge, pour qu'on
     atterrisse directement où on a cliqué sans voir de saut intermédiaire. -->
<div class="route-veil" [class.route-veil--visible]="voile()" aria-hidden="true"></div>

<!-- Bandeau PWA (F9.0) : propose l'installation, ou signale qu'une nouvelle
     version attend d'être appliquée. Ne rend RIEN tant que le navigateur n'a
     rien signalé — donc rien au rendu serveur, et l'hydratation tient. -->
<app-pwa-banner />

<!-- Bandeau de consentement à la mesure d'audience (F16) -->
<app-cookie-consent-banner />
