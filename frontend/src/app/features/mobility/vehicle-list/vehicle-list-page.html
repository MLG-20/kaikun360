<!-- Page univers Transport (F2.4). -->
<!-- Textes par défaut : le back-office peut les remplacer et poser une photo
     de fond, sans redéploiement (F12). -->
<app-page-hero
  heroKey="transport"
  eyebrow="Univers Transport"
  title="Un véhicule adapté à chaque trajet"
  lead="Voitures, 4x4, minibus et pirogues, avec ou sans chauffeur, proposés par des prestataires vérifiés. Filtrez selon vos places et votre budget, puis demandez votre réservation."
>
  <ul class="uni-hero-points">
    @for (point of highlights; track point.title) {
      <li class="uni-hero-point">
        <span class="uni-hero-point-title">{{ point.title }}</span>
        <span class="uni-hero-point-text">{{ point.text }}</span>
      </li>
    }
  </ul>

  <p class="uni-hero-cross">
    Besoin d'une navette, d'un transfert aéroport ou d'une excursion organisée ?
    <a routerLink="/mobilite">Voir la Mobilité →</a>
  </p>
</app-page-hero>

<div class="k-wrap uni-catalog">
  <app-catalog universe="transport" />
</div>
