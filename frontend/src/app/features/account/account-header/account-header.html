<header class="acc-topbar">
  <div class="acc-bar">
    <div class="acc-left">
      <!-- Bouton hamburger (petit écran) : ouvre le tiroir de navigation à gauche -->
      <button
        class="acc-burger"
        type="button"
        (click)="sidebarToggle.emit()"
        [attr.aria-expanded]="sidebarOpen()"
        aria-label="Ouvrir le menu de l’espace"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <span class="acc-title">Espace client</span>
    </div>

    <div class="acc-actions">
      <!-- Cloche : accès direct au centre de notifications + pastille non-lues (F3.6) -->
      <a
        class="acc-bell"
        routerLink="/mon-espace/notifications"
        [attr.aria-label]="
          unreadCount() > 0
            ? 'Mes notifications, ' + unreadCount() + ' non lues'
            : 'Mes notifications'
        "
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M10.5 21a1.8 1.8 0 0 0 3 0" />
        </svg>
        @if (unreadCount() > 0) {
          <span class="acc-bell-badge" aria-hidden="true">
            {{ unreadCount() > 9 ? '9+' : unreadCount() }}
          </span>
        }
      </a>

      <!-- Menu utilisateur -->
      <div class="acc-user">
        <button
          class="acc-user-btn"
          type="button"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="userMenuOpen()"
          aria-label="Menu du compte"
        >
          <span class="acc-avatar" aria-hidden="true">{{ initial() }}</span>
          <span class="acc-user-name">{{ user()?.name }}</span>
          <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>

        @if (userMenuOpen()) {
          <div class="acc-user-menu" role="menu">
            <div class="acc-user-head">
              <strong>{{ user()?.name }}</strong>
              @if (user()?.email || user()?.phone) {
                <span>{{ user()?.email || user()?.phone }}</span>
              }
            </div>
            <a class="acc-user-item" routerLink="/mon-espace/profil" role="menuitem">
              Mon profil
            </a>
            <button class="acc-user-item" type="button" role="menuitem" (click)="logout()">
              Se déconnecter
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
