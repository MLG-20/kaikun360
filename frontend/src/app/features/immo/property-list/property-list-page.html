<!-- Page univers Immobilier (F2.3). -->
<!-- Les textes ci-dessous restent la version par défaut : le back-office peut
     les remplacer et charger une photo de fond, sans redéploiement (F12). -->
<app-page-hero
  heroKey="immobilier"
  eyebrow="Univers Immobilier"
  title="Des biens vérifiés, prêts à visiter"
  lead="Appartements, villas, terrains et locaux professionnels au Sénégal — chaque annonce est contrôlée avant sa mise en ligne. Filtrez, comparez, puis demandez une visite en toute confiance."
>
  <ul class="uni-hero-points">
    @for (point of highlights; track point.title) {
      <li class="uni-hero-point">
        <span class="uni-hero-point-title">{{ point.title }}</span>
        <span class="uni-hero-point-text">{{ point.text }}</span>
      </li>
    }
  </ul>

  <!-- Point d'entrée propriétaire vers le dépôt de bien (F2.7). -->
  <div class="uni-hero-actions">
    <a class="k-btn k-btn--gold" routerLink="/deposer-un-bien">Vous êtes propriétaire ? Déposer un bien</a>
  </div>
</app-page-hero>

<div class="k-wrap uni-catalog">
  <app-catalog universe="immobilier" />
</div>
