<!-- Page univers Tourisme (F2.4). -->
<!-- Textes par défaut : le back-office peut les remplacer et poser une photo
     de fond, sans redéploiement (F12). -->
<app-page-hero
  heroKey="tourisme"
  eyebrow="Univers Tourisme"
  title="Explorez le Sénégal, en toute confiance"
  lead="Excursions, circuits culturels et découvertes nature, portés par des prestataires vérifiés. Comparez les programmes, vérifiez les places restantes, puis demandez votre réservation."
>
  <ul class="uni-hero-points">
    @for (point of highlights; track point.title) {
      <li class="uni-hero-point">
        <span class="uni-hero-point-title">{{ point.title }}</span>
        <span class="uni-hero-point-text">{{ point.text }}</span>
      </li>
    }
  </ul>
</app-page-hero>

<div class="k-wrap uni-catalog">
  <app-catalog universe="tourisme" />
</div>
