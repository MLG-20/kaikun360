@for (item of items(); track item.card.id) {
  @let c = item.card;
  @if (item.target.internal) {
    <a class="vsc-card" [routerLink]="item.target.path" [queryParams]="item.target.query">
      <ng-container *ngTemplateOutlet="body; context: { $implicit: c }" />
    </a>
  } @else {
    <a class="vsc-card" [href]="item.target.href">
      <ng-container *ngTemplateOutlet="body; context: { $implicit: c }" />
    </a>
  }
}

<ng-template #body let-c>
  <img class="vsc-media" [src]="c.image" [alt]="c.title" loading="lazy" />
  <span class="vsc-text">
    <span class="vsc-title">{{ c.title }}</span>
    @if (c.description) {
      <span class="vsc-desc">{{ c.description }}</span>
    }
    <span class="vsc-cta">{{ c.linkLabel || 'Découvrir' }} →</span>
  </span>
</ng-template>
