<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Kaikun 360 — Habiter, investir, voyager et se déplacer au Sénégal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="La plateforme sénégalaise qui réunit immobilier, construction, gestion locative, nuitées, tourisme et mobilité.">
  <meta name="theme-color" content="#03193F">

  <!-- Référencement (F9.1) — ⚠️ CE `noindex` EST UN FILET DE SÉCURITÉ, PAS UNE
       ERREUR. `SeoService` le remplace par « index, follow » sur chaque page
       publique, dès la navigation. Il ne survit donc que là où l'application
       n'a JAMAIS abouti à une page publique.

       Le cas réel qu'il couvre : une URL d'espace connecté (`/mon-espace/…`,
       `/back-office/…`) demandée par un robot. Côté serveur il n'y a pas de
       session ; la garde annule la navigation, et le rendu sort une page
       **vide en HTTP 200**. Sans ce repli, Google recevrait une page blanche
       indexable — ce qu'il traite comme un « soft 404 » et compte au passif de
       tout le domaine.

       ⚠️ Ne jamais le retirer « parce que le site est public » : c'est
       exactement l'inverse: il ne s'applique qu'aux pages qui ne le sont pas. -->
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- PWA (F9.0) : l'application devient installable sur l'écran d'accueil —
       réponse au CDC §5 par la voie PWA plutôt qu'un projet Expo. -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- ⚠️ iOS ignore le manifeste pour l'icône : sans cette balise, un raccourci
       « Sur l'écran d'accueil » affiche une capture de la page. L'image est
       OPAQUE et à angles droits — iOS applique lui-même le masque, et une PNG
       à coins transparents y apparaîtrait cerclée de noir. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Kaikun 360">

  <!-- Typographie du design system Kaikun (F0.3). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
