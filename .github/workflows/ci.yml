name: CI

# Backend et frontend sont deux jobs indépendants (le dépôt reste un
# monorepo, mais rien ne les lie techniquement) : un push qui ne touche que
# le frontend n'attend pas la suite PHPUnit, et inversement.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: kaikun360_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      # PHP 8.4 : composer.lock verrouille des paquets (symfony/*, laravel/framework
      # v13.17) qui exigent réellement >=8.4.1, malgré le "php": "^8.3" de
      # composer.json (voir docker/README.md, même piège rencontré en Docker).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, gd, zip, bcmath, intl, pcntl, exif, redis
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Attendre MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot --silent; do sleep 2; done

      - name: Suite de tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kaikun360_test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build de production (SSR)
        run: npm run build -- --configuration production
