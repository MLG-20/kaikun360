; Limites d'upload/traitement d'image — l'image de base php:8.4-fpm-alpine
; plafonne `upload_max_filesize` à 2M par défaut, largement sous ce que les
; règles de validation Laravel autorisent elles-mêmes (8 Mo pour une photo de
; bandeau/héros, voir StoreHomeHeroSlideRequest et AdminHeroController) : toute
; photo entre 2 et 8 Mo — courant pour une photo prise au téléphone — était
; tronquée par PHP avant même d'atteindre Laravel, qui la voyait comme un
; fichier manquant (422 générique, aucun indice côté utilisateur).
upload_max_filesize = 10M
post_max_size = 12M

; GD décompresse l'image ENTIÈRE en mémoire avant la compression faite par
; ImageProcessor (redimensionnement à BACKGROUND_MAX_WIDTH) — une photo de
; téléphone moderne (ex. 4000×3000, bien au-delà des 8 Mo compressés une fois
; envoyée) peut demander largement plus que les 128M par défaut le temps de ce
; traitement.
memory_limit = 256M
