# Point d'entrée unique du site (F9.1 : une seule origine, comme en dev via
# proxy.conf.json — voir frontend/proxy.conf.json pour le même découpage).
# /api, /storage et /sitemap.xml vont à Laravel (php-fpm) ; tout le reste va
# au serveur SSR Angular. TLS terminé ici (certificat Let's Encrypt obtenu
# via un conteneur certbot ponctuel, voir docker/README.md).
client_max_body_size 20m;

# Résolveur DNS interne de Docker, avec un TTL court : un `upstream{}` figé
# résout "backend"/"frontend" UNE SEULE FOIS au démarrage de nginx et garde
# cette IP pour toujours — si ce conteneur est recreé (déploiement, redémarrage
# après incident) sans redémarrer nginx aussi, chaque requête tombe en 502
# (IP obsolète) jusqu'à un `docker compose restart nginx` manuel. En passant
# la cible par une variable, nginx redemande l'IP à chaque connexion expirée.
resolver 127.0.0.11 valid=10s;

server {
    # Un seul bloc pour les deux ports : évite de dupliquer les location{}
    # entre HTTP et HTTPS. Le port 80 reste ouvert (pas de redirection
    # forcée) pour ne jamais bloquer le renouvellement Certbot, qui passe
    # par ce port en clair via le proxy Cloudflare.
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/kaikun360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaikun360.com/privkey.pem;

    set $backend_fpm backend:9000;
    set $frontend_ssr http://frontend:4000;

    # Fichier de vérification déposé par Certbot (méthode webroot) pour
    # prouver la maîtrise du domaine avant de délivrer/renouveler le
    # certificat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # Photos et pièces jointes publiques (disque `public`, lien
    # storage/app/public → public/storage) : servies en fichier statique,
    # jamais réexécutées par PHP.
    location /storage/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    location / {
        proxy_pass $frontend_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
