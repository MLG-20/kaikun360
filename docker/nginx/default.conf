# Point d'entrée unique du site (F9.1 : une seule origine, comme en dev via
# proxy.conf.json — voir frontend/proxy.conf.json pour le même découpage).
# /api, /storage et /sitemap.xml vont à Laravel (php-fpm) ; tout le reste va
# au serveur SSR Angular. Pas de TLS ici : le VPS termine HTTPS en amont
# (reverse proxy / certificat), cette configuration ne sert que le réseau
# interne Docker (voir docker-compose.yml).
client_max_body_size 20m;

# Résolveur DNS interne de Docker, avec un TTL court : un `upstream{}` figé
# résout "backend"/"frontend" UNE SEULE FOIS au démarrage de nginx et garde
# cette IP pour toujours — si ce conteneur est recreé (déploiement, redémarrage
# après incident) sans redémarrer nginx aussi, chaque requête tombe en 502
# (IP obsolète) jusqu'à un `docker compose restart nginx` manuel. En passant
# la cible par une variable, nginx redemande l'IP à chaque connexion expirée.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    set $backend_fpm backend:9000;
    set $frontend_ssr http://frontend:4000;

    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # Photos et pièces jointes publiques (disque `public`, lien
    # storage/app/public → public/storage) : servies en fichier statique,
    # jamais réexécutées par PHP.
    location /storage/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    location / {
        proxy_pass $frontend_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
