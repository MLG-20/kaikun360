# Orchestration locale/VPS de Kaikun360. Un seul point d'entrée HTTP (nginx,
# port 80) ; tout le reste dialogue sur le réseau interne Docker. Pas de TLS
# ici — voir docker/README.md pour ce que ça change en déploiement réel.
#
# Démarrage : cp .env.docker.example .env.docker (à remplir), puis
#   docker compose --env-file .env.docker up --build
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # SSL désactivé : réseau interne Docker seulement, et le client mariadb de
    # l'image backend refuse par défaut le certificat auto-signé que MySQL 8
    # génère sinon ("TLS/SSL error: self-signed certificate in certificate
    # chain"), ce qui fait échouer le chargement du schéma au premier démarrage.
    # `mysql_native_password` : le client mariadb de l'image backend n'a pas
    # le plugin `caching_sha2_password` (défaut de MySQL 8) dans sa build alpine.
    command: ["--skip-ssl", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kaikun360}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: base
    restart: unless-stopped
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - storage-public:/var/www/html/storage/app/public
      - storage-private:/var/www/html/storage/app/private
      - storage-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: base
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env.docker
    volumes:
      - storage-public:/var/www/html/storage/app/public
      - storage-private:/var/www/html/storage/app/private
      - storage-logs:/var/www/html/storage/logs
    depends_on:
      backend:
        condition: service_started

  queue-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: base
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    env_file: .env.docker
    volumes:
      - storage-public:/var/www/html/storage/app/public
      - storage-private:/var/www/html/storage/app/private
      - storage-logs:/var/www/html/storage/logs
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      # Vu DEPUIS ce conteneur : nginx est le seul chemin http vers Laravel
      # (php-fpm ne parle pas HTTP). Sert au relais /sitemap.xml et à la CSP.
      API_ORIGIN: http://nginx
      # Protection anti-SSRF intégrée à @angular/ssr (node.mjs) : toute
      # requête dont l'en-tête `Host` n'est pas dans cette liste est rejetée
      # en 400, AVANT même d'atteindre le routeur Angular. Sans elle, le site
      # entier est inaccessible dès qu'on ne l'ouvre pas en `localhost`.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage-public:/var/www/html/public/storage:ro
      # Partagé avec le conteneur certbot : fichiers de vérification
      # (webroot) et certificats obtenus. Lecture seule ici, certbot y écrit.
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql-data:
  redis-data:
  storage-public:
  storage-private:
  storage-logs:
  certbot-webroot:
  certbot-certs:
